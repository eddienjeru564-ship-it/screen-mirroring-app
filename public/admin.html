<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — ScreenView</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f1221" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap" style="max-width:1100px">
    <div class="topbar">
      <div class="logo"><span class="dot"></span> ScreenView · Admin</div>
      <div class="spacer"></div>
      <button class="btn secondary small hidden" data-install>⬇ Install app</button>
      <a href="/">Home</a>
    </div>

    <section id="login" class="panel" style="max-width:420px">
      <h1>Admin sign-in</h1>
      <div class="card">
        <label for="adminPw">Admin password</label>
        <input id="adminPw" type="password" autocomplete="current-password" />
        <div style="margin-top:16px"><button id="loginBtn" class="btn block">Sign in</button></div>
        <p id="loginError" class="alert err hidden" style="margin-top:14px"></p>
      </div>
    </section>

    <section id="dash" class="panel hidden">
      <div class="row" style="justify-content:space-between">
        <h1 style="margin:0">Recent sessions</h1>
        <div class="row">
          <button id="refreshBtn" class="btn secondary">Refresh</button>
          <button id="logoutBtn" class="btn secondary">Sign out</button>
        </div>
      </div>
      <div class="card" style="overflow-x:auto;padding:8px">
        <table>
          <thead>
            <tr>
              <th class="mono">Code</th>
              <th>Started</th>
              <th>Ended</th>
              <th>Duration</th>
              <th>Viewer joins / leaves</th>
              <th>End reason</th>
              <th>Options</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="empty" class="muted hidden" style="padding:12px">No sessions logged yet.</p>
      </div>
    </section>
  </div>
  <script type="module" src="admin.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
