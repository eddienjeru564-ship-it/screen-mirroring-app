<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View a screen — ScreenView</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236c8cff'/><rect x='24' y='30' width='52' height='34' rx='4' fill='white'/><rect x='42' y='66' width='16' height='6' rx='2' fill='white'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="logo"><span class="dot"></span> ScreenView</div>
      <div class="spacer"></div>
      <a href="/">Home</a>
    </div>

    <!-- Step 1: enter code -->
    <section id="entry" class="panel">
      <h1>View a screen</h1>
      <p class="lede">Enter the 6-digit code from the person sharing. You’ll watch
        their screen live — view-only.</p>
      <div class="card">
        <label for="codeInput">Join code</label>
        <input id="codeInput" class="code-input" type="text" inputmode="numeric"
               autocomplete="off" placeholder="000-000" maxlength="7" />

        <div id="pwField" class="hidden">
          <label for="pwInput">Session password</label>
          <input id="pwInput" type="password" autocomplete="off" placeholder="Password from the host" />
        </div>

        <div style="margin-top:18px">
          <button id="joinBtn" class="btn block">Watch</button>
        </div>
        <p id="entryError" class="alert err hidden" style="margin-top:14px"></p>
      </div>
    </section>

    <!-- Step 2: watching -->
    <section id="watch" class="panel hidden">
      <div class="row" style="justify-content:space-between">
        <h1 style="margin:0">Live screen</h1>
        <span id="statusBadge" class="badge"><span class="led"></span> <span id="statusText">Connecting…</span></span>
      </div>
      <div class="stage">
        <video id="video" autoplay playsinline muted></video>
        <div id="overlay" class="overlay">
          <div class="spinner"></div>
          <div id="overlayText">Connecting to the shared screen…</div>
        </div>
        <button id="fsBtn" class="btn fs-btn">⛶ Fullscreen</button>
      </div>
      <div class="row">
        <button id="leaveBtn" class="btn secondary">Leave</button>
        <span class="muted">You can only watch — ScreenView never sends your input to the host.</span>
      </div>
    </section>

    <!-- Step 3: ended -->
    <section id="gone" class="panel hidden">
      <h1 id="goneTitle">Session ended</h1>
      <p id="goneReason" class="lede"></p>
      <div class="row">
        <a class="btn" href="/view">Enter another code</a>
        <a class="btn secondary" href="/">Home</a>
      </div>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="view.js"></script>
</body>
</html>
